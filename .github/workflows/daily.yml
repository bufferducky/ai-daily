name: 每日早报

on:
  schedule:
    # 00:05 UTC = 北京时间 08:05，抢在源站最早可能发布（08:20 左右）之前启动。
    # 不用整点：GitHub 在整点负载最高，schedule 会延迟甚至丢弃排队任务。
    # 具体几点推不靠猜，交给下面的「等待当天内容发布」步骤轮询。
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "即使最新一期不是今天也推送（测试用）"
        type: boolean
        default: false
      dry_run:
        description: "只打印要推送的内容，不真的发送"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 并发锁放在 deploy job 上，不放在 workflow 上：
# 「等待当天内容发布」最长会占几分钟到两小时，锁在 workflow 级会挡住手动触发，
# 也会让手动触发反过来取消还在等的定时任务。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 定时任务跑在源站发布之前，这里等到当天这一期真的出现再构建；
      # 等不到就明确失败（红），不再像以前那样静默跳过。手动触发时不等待。
      - name: 等待当天内容发布
        if: github.event_name == 'schedule'
        env:
          POLL_SECONDS: "300"
          DEADLINE: "10:30"
        run: python3 wait_for_today.py

      - name: 抓取并渲染
        run: python3 build.py

      - name: 推送通知
        # 钉钉抖动不该连累站点部署：失败只标黄，不阻断 deploy
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FORCE: ${{ inputs.force_notify }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ] && [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK / DINGTALK_WEBHOOK，跳过推送"
            exit 0
          fi
          ARGS=""
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          python3 notify.py $ARGS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
