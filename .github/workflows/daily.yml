name: 每日早报

on:
  schedule:
    # GitHub schedule 最短间隔为 5 分钟；多次启动机会降低单次漏调度的影响。
    # UTC 00:30—02:00 = 北京 08:30—10:00，迟到的运行由 gate 拦截。
    - cron: "30-59/5 0 * * *"
    - cron: "*/5 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "忽略当天成功记录和内容日期，强制推送（测试用）"
        type: boolean
        default: false
      dry_run:
        description: "只打印要推送的内容，不真的发送"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # 检查回执、发送、保存回执必须串行；后来的触发不能取消正在轮询的任务。
    # 手动任务也使用同一把锁，避免和定时任务同时推送。
    concurrency:
      group: ai-daily-delivery
      cancel-in-progress: false
    outputs:
      built: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查执行窗口和当天成功记录
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_notify }}
          DRY: ${{ inputs.dry_run }}
        run: python3 delivery_gate.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: 每分钟等待当天内容，10点截止
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        env:
          POLL_SECONDS: "60"
          DEADLINE: "10:00"
        run: python3 -u wait_for_today.py

      - name: 抓取并渲染
        if: steps.gate.outputs.run == 'true'
        run: python3 build.py

      - name: 推送通知
        if: steps.gate.outputs.run == 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FORCE: ${{ inputs.force_notify }}
          DRY: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          python3 notify.py "${ARGS[@]}"

      - name: 生成推送成功回执
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.record == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {"run_id": os.environ["GITHUB_RUN_ID"]}
          (Path(os.environ["RUNNER_TEMP"]) / "notified.json").write_text(json.dumps(receipt))
          PY

      - name: 保存当天推送成功记录
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.record == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notified-${{ steps.gate.outputs.today }}
          path: ${{ runner.temp }}/notified.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        id: pages
        if: steps.gate.outputs.run == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
